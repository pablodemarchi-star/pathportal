{% if detail.format == 'Online' %}
<li data-report-stage="candidates" class="staff-report-components" data-report-components data-absence-kind="it" data-module-options='{{ detail.end_checks.it_module_options|tojson }}'>
  <b>Candidate IT issues</b>
  <label class="staff-session-report-checkbox"><input type="radio" name="it_issues" value="0" required><span>No candidate IT issues were reported during the exam session.</span></label>
  <label class="staff-session-report-checkbox"><input type="radio" name="it_issues" value="1" required><span>One or more candidates were unable to complete one or more exam modules due to technical difficulties or power outages.</span></label>
  <div data-component-absence-panel hidden>
    <p class="staff-detail-muted">Enter the original candidate number and select the absent exam modules allowed for the session and exam level.</p>
    <div class="staff-report-consideration-chips staff-report-candidate-chips" data-component-absence-rows></div>
    <button type="button" class="staff-detail-link staff-report-add-component" data-add-component-absence>＋ Add candidate component absence</button>
    <p class="staff-detail-muted" data-component-absence-error role="status"></p>
  </div>
  <input type="hidden" name="it_absences" value="[]" data-component-absence-json>
  <template data-component-absence-template>
    <fieldset class="staff-report-component-candidate">
      <legend>Candidate IT issues</legend>
      <div class="staff-report-component-fields">
        <label>Candidate number (excluding the appended digit)<input type="text" inputmode="numeric" pattern="[0-9]+" maxlength="80" data-component-field="number" required></label>
        <label>Candidate name<input type="text" maxlength="250" data-component-field="name" required></label>
        <label>Institution<input type="text" maxlength="250" data-component-field="institution" required></label>
        <label>Exam<select data-component-field="exam" required><option value="">Select exam</option>{% for exam in detail.end_checks.it_module_options %}<option>{{ exam }}</option>{% endfor %}</select></label>
        <div class="staff-report-it-modules" data-it-modules>
          <b>Absent exam modules</b>
          <small class="staff-detail-muted" data-it-module-hint>Select Exam first.</small>
          <div class="staff-report-it-module-options">
            {% for value, label in [('Speaking','Speaking'), ('Listening and speaking','Listening and Speaking'), ('Reading and writing','Reading and Writing')] %}
            <label class="staff-report-it-module" hidden><input type="checkbox" data-it-module value="{{ value }}"><span>{{ label }}</span></label>
            {% endfor %}
          </div>
        </div>
        <label class="staff-report-component-reason">Reason<textarea rows="3" maxlength="10000" data-component-field="reason" required></textarea></label>
      </div>
    </fieldset>
  </template>
</li>
{% endif %}
